name: Build MN Emulator IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install tools
        run: |
          brew install xcodegen cmake zstd

      # ==========================================
      # Step 1: Build Box64 executable for iOS
      # ==========================================
      - name: Clone Box64
        run: |
          # Pinned to a known-good upstream ref that carries the 16K-host mmap
          # fix (3c670ef "[MMAP] Fixed wine mappings on 16K hosts" + BIND_NOW
          # support). Bump this ref to pull newer box64; the compat elf.h in
          # MNEmulator/Native/Compat must define any new DT_DF_1_* macros.
          BOX64_REF=3c670ef
          if [ ! -d "Box64Source/box64" ]; then
            git clone https://github.com/ptitSeb/box64.git Box64Source/box64
            git -C Box64Source/box64 checkout "$BOX64_REF"
          else
            # Refresh a persisted tree so a stale checkout never silently
            # diverges from upstream (v410's device log came from a tree whose
            # elfloader/elfparser sources had moved but whose objects had not).
            git -C Box64Source/box64 fetch --depth 1 origin "$BOX64_REF"
            git -C Box64Source/box64 reset --hard "$BOX64_REF"
          fi

      - name: Patch Box64 for iOS
        run: |
          BOX64_SRC="$PWD/Box64Source/box64"
          cd "$BOX64_SRC"
          echo "Patching Box64 for iOS..."

          # Patch 1: Mark as forked process to skip loadProtectionFromEnv/cleanProtectionFromEnv
          # These iterate mmap pages calling mprotect — unnecessary and slow on iOS
          if [ -f src/box64.c ]; then
            # Find the 'inited = 1' line and append forked_process setting after it
            sed -i.bak '/inited = 1;/a\
            if(my_context) my_context->forked_process = 1;' src/box64.c
            echo "  Patched src/box64.c: set forked_process=1"
          fi

          # Patch 2: Ensure openFTrace doesn't crash on iOS (no writable tracer.txt)
          if [ -f src/tools/dbg_getline.c ]; then
            sed -i.bak 's/open("tracer.txt"/open("\/dev\/null"/g' src/tools/dbg_getline.c
            echo "  Patched dbg_getline.c: redirect tracer.txt to /dev/null"
          fi

          # Patch 3: Use getauxval for HWCAP on iOS instead of /proc/cpuinfo when available
          # Box64 already handles this on Android, but add safety for any raw /proc/cpuinfo fopen
          find src/ -name "*.c" -exec grep -l 'fopen.*"/proc/cpuinfo"' {} \; 2>/dev/null | while read f; do
            echo "  Found /proc/cpuinfo fopen in: $f (already handled by Box64)"
          done

          # Patch 4: Disable box_mmap's wine-restrict MAP_FIXED remap on iOS.
          # On Linux, mappings created while box64_wine=1 get unmap + MAP_FIXED
          # re-created at a 47-bit hint address (custommem.c:3310-3324). iOS has
          # no such address space, so that remap ALWAYS fails and EVERY guest
          # mmap dies with "cannot allocate 0x4000 aligned bytes for bridge"
          # (SIGSEGV in AddBridge2 at 0xffffffffffffffff). Compile the whole
          # NOALIGN post-mmap block out on iOS by tightening its guard.
          if [ -f src/custommem.c ]; then
            if grep -q '^#if !defined(NOALIGN)$' src/custommem.c; then
              sed -i.bak 's|^#if !defined(NOALIGN)$|#if !defined(NOALIGN) \&\& !defined(__IOS__)|' src/custommem.c
              if grep -q 'NOALIGN) && !defined(__IOS__)' src/custommem.c; then
                echo "  Patched custommem.c: NOALIGN post-mmap block disabled on iOS"
              else
                echo "ERROR: custommem.c NOALIGN guard patch did not apply cleanly"
                exit 1
              fi
            else
              echo "ERROR: custommem.c '#if !defined(NOALIGN)' guard not found — patch failed!"
              exit 1
            fi
          fi

          echo "Patching complete."

      - name: Patch Box64 version-check debug logging
        run: |
          BOX64_SRC="$PWD/Box64Source/box64"
          cd "$BOX64_SRC"
          python3 "$PWD/../../Scripts/patch_version_debug.py"

      - name: Patch Box64 ELF segment load (large-page zeroing fix)
        run: |
          BOX64_SRC="$PWD/Box64Source/box64"
          cd "$BOX64_SRC"
          python3 "$PWD/../../Scripts/patch_elf_mmap_fix.py"

      - name: Patch Box64 x64 syscall dispatch for Darwin
        run: |
          # Rewire x64syscall.c so 1:1-valid syscalls go through box64_raw_syscall
          # (class-bit svc, immune to LiveContainer's libc interposer) and
          # exit/exit_group/kill/getcwd/time/getdents64/clock_* are handled in
          # switch cases instead of raw Darwin traps. Must run after the elf
          # mmap fix (both edit src/ files; each patch detects stale state and
          # restores via git before re-applying).
          BOX64_SRC="$PWD/Box64Source/box64"
          cd "$BOX64_SRC"
          python3 "$PWD/../../Scripts/patch_x64syscall_darwin.py"
      - name: Patch Box64 emulation quit-state diagnostics
        run: |
          # Instrument emulate()/Run()/EmuRun() to trace when emu->quit gets
          # set before the main DynaRun. Without this, wine64 exits with
          # "Emulation finished, EAX=0" and ZERO guest syscalls/output, meaning
          # the interpreter never ran. Breadcrumbs land in box64_runner.log via
          # the runner's dup2. Must run after the syscall patch (both edit
          # src/ files; this patch restores stale state via git before applying).
          BOX64_SRC="$PWD/Box64Source/box64"
          cd "$BOX64_SRC"
          python3 "$PWD/../../Scripts/patch_quit_diag.py"
      - name: Build Box64 for iOS
        run: |
          echo "=========================================="
          echo "  Compiling Box64 for iOS ARM64"
          echo "=========================================="
          
          BOX64_SRC="$PWD/Box64Source/box64"
          OUTPUT_DIR="$PWD/MNEmulator/Native/Box64Lib"
          # Force a full recompile every build: a stale objects/ tree (v410
          # compiled elfloader/elfparser from an older source revision) produces
          # a binary whose behavior does not match the patched sources.
          rm -rf "$OUTPUT_DIR/objects"
          mkdir -p "$OUTPUT_DIR/objects"
          
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          AR=$(xcrun --sdk iphoneos --find ar)
          
          COMPAT_DIR="$PWD/MNEmulator/Native/Compat"
          
          # Build include flags: our compat dir FIRST to override system headers
          INC_FLAGS="-I$COMPAT_DIR -I$BOX64_SRC/src/include -I$BOX64_SRC/src"
          while IFS= read -r d; do
              INC_FLAGS="$INC_FLAGS -I$d"
          done < <(find "$BOX64_SRC/src" -type d)
          
          CFLAGS="-arch arm64 -mios-version-min=16.0 -isysroot $SDK -O2 -fembed-bitcode-marker"
          CFLAGS="$CFLAGS -DARM64 -DNOGIT -D__IOS__=1 -DTARGET_IPHONE=1"
          CFLAGS="$CFLAGS -DBAD_SIGNAL=1 -DBOX64_ENV=1 -D_XOPEN_SOURCE=600 -D_DARWIN_C_SOURCE"
          CFLAGS="$CFLAGS $INC_FLAGS"
          CFLAGS="$CFLAGS -Wno-unused-variable -Wno-unused-function -Wno-incompatible-pointer-types"
          CFLAGS="$CFLAGS -Wno-int-conversion -Wno-pointer-sign -Wno-implicit-function-declaration"
          CFLAGS="$CFLAGS -Wno-deprecated-declarations -Wno-missing-declarations"
          CFLAGS="$CFLAGS -Wno-missing-prototypes -Wno-strict-prototypes"
          CFLAGS="$CFLAGS -Wno-macro-redefined -Wno-error"
          CFLAGS="$CFLAGS -ferror-limit=0"
          CFLAGS="$CFLAGS -include $COMPAT_DIR/ios_linux_compat.h"
          CFLAGS="$CFLAGS -DSTEP=1 -DSTACKALIGN=16"
          
          # intercept exit()/_exit()/_Exit() so Box64 can't kill the iOS app
          # (an un-intercepted _exit() was a prime suspect for the instant crash)
          BOX64_CFLAGS="$CFLAGS -Dexit(x)=box64_exit_intercept(x) -D_exit(x)=box64_exit_intercept(x) -D_Exit(x)=box64_exit_intercept(x)"
          
          # Exclude files that cannot compile on Darwin
          EXCLUDE="custommmap.c emit_signal_wine.c os_wine.c hostext_wine.c random_wine.c emit_signals_linux.c freq_linux.c hostext_linux.c os_linux.c obstack.c threads32.c dynacache.c signals.c signal32.c sigtools.c syscall_user_dispatch.c dynarec_arm64_arch.c elfhacks.c my_x11_xevent.c myalign64_32.c myalignxcb32.c sdl1rwops.c sdl2rwops.c libc_net32.c arm64_printer.c threads.c myalign32.c libdl.c symbolfuncs_linux.c mallochook.c elfload_dump32.c x86int3.c elfhash32.c box32stack.c globalsymbols32.c elfparser32.c elfloader32.c x86syscall_32.c"
          
          # Find core .c files under src/ (excluding wrapped/ and wrapped32/ — Linux-only libs)
          SOURCES=""
          for dir in src src/emu src/custommem src/os src/tools src/libtools src/elfs src/librarian; do
              if [ -d "$BOX64_SRC/$dir" ]; then
                  for f in "$BOX64_SRC/$dir"/*.c; do
                      [ -f "$f" ] || continue
                      BASE=$(basename "$f")
                      SKIP=0
                      for ex in $EXCLUDE; do [ "$BASE" = "$ex" ] && SKIP=1 && break; done
                      [ $SKIP -eq 0 ] && SOURCES="$SOURCES $f"
                  done
              fi
          done
          
          # Skip ALL wrapped/ files — Linux-only library wrappers (GTK, X11, Wayland, PulseAudio, ICU etc.)
          # Not needed for Wine on iOS. Only core libc/libm/libpthread would be needed but those are provided by system.
          
          # Skip ALL wrapped/ files and dynarec — use Box64 interpreter only (DYNAREC crashes on iOS due to JIT memory requirements)
          
          # Add our iOS stubs (without exit macro - stubs defines box64_exit_intercept)
          STUB_SRC="$PWD/MNEmulator/Native/SyscallTranslation/ios_stubs.c"
          RAW_SRC="$PWD/MNEmulator/Native/SyscallTranslation/rawlibc.c"
          IOSSC_SRC="$PWD/MNEmulator/Native/SyscallTranslation/ios_syscalls.c"
          
          SRC_COUNT=$(echo $SOURCES | wc -w)
          echo "Found $SRC_COUNT source files + ios_stubs.c"
          
          COMPILED=0
          FAILED=0
          
          for src in $SOURCES; do
              OBJ="$OUTPUT_DIR/objects/$(basename "$src" .c).o"
              
              if $CC $BOX64_CFLAGS -c "$src" -o "$OBJ" 2>/tmp/box64_err_$$; then
                  COMPILED=$((COMPILED + 1))
              else
                  FAILED=$((FAILED + 1))
                  # Print up to 30 error lines per file so one run shows the
                  # FULL error list (-ferror-limit=0), not just the first.
                  echo "=== FAIL: $src ===" >> compile_errors.log
                  cat /tmp/box64_err_$$ 2>/dev/null | grep -i "error:" | head -30 >> compile_errors.log
                  cat /tmp/box64_err_$$ 2>/dev/null | grep -i "error:" | head -30
                  if ! grep -qi "error:" /tmp/box64_err_$$ 2>/dev/null; then
                      cat /tmp/box64_err_$$ 2>/dev/null | tail -5
                  fi
                  echo "=== end $src ===" >> compile_errors.log
              fi
              rm -f /tmp/box64_err_$$
          done
          
          # Compile ios_stubs.c WITHOUT exit macro (it defines box64_exit_intercept)
          echo "Compiling ios_stubs.c (without exit macro)..."
          if $CC $CFLAGS -c "$STUB_SRC" -o "$OUTPUT_DIR/objects/ios_stubs.o" 2>/tmp/box64_err_$$; then
              COMPILED=$((COMPILED + 1))
              echo "ios_stubs.c: OK"
          else
              echo "ios_stubs.c: FAILED"
              cat /tmp/box64_err_$$ 2>/dev/null | tail -3
          fi
          rm -f /tmp/box64_err_$$

          # Compile rawlibc.c (raw-syscall layer) WITHOUT the compat header
          # macros — the macros would rewrite this file's own function bodies
          # (box64_raw_* is what they redirect TO) → infinite recursion.
          echo "Compiling rawlibc.c (raw-syscall layer, no compat macros)..."
          if $CC -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" -O2 -fembed-bitcode-marker \
              -D_DARWIN_C_SOURCE=1 -Wno-error \
              -c "$RAW_SRC" -o "$OUTPUT_DIR/objects/rawlibc.o" 2>/tmp/box64_err_$$; then
              COMPILED=$((COMPILED + 1))
              echo "rawlibc.c: OK"
          else
              echo "rawlibc.c: FAILED"
              cat /tmp/box64_err_$$ 2>/dev/null | tail -5
          fi
          rm -f /tmp/box64_err_$$

          # Compile ios_os.c (os-layer funcs needing box64 internals) WITHOUT
          # the exit macros, WITH the compat header + box64 include dirs.
          # It defines no libSystem-colliding interposers, so ios_os.o is NOT
          # excluded from Pass-A; its symbols are subtracted from the gap list.
          echo "Compiling ios_os.c (os-layer, box64 headers)..."
          if $CC $CFLAGS -c "$PWD/MNEmulator/Native/SyscallTranslation/ios_os.c" -o "$OUTPUT_DIR/objects/ios_os.o" 2>/tmp/box64_err_$$; then
              COMPILED=$((COMPILED + 1))
              echo "ios_os.c: OK"
          else
              echo "ios_os.c: FAILED"
              cat /tmp/box64_err_$$ 2>/dev/null | tail -5
          fi
          rm -f /tmp/box64_err_$$

          # Compile ios_syscalls.c (Darwin my_* syscall helpers) WITH the compat
          # header + box64 include dirs, WITHOUT the exit macros. Its strong
          # my_open/my_stat/my_lstat/my_fstat/my_fstatat/my_readlink/my_mmap64/
          # my_munmap/my_mprotect symbols replace the wrappedlibc.c definitions
          # that are EXCLUDED from the iOS build; without them x64syscall.c's
          # dispatch calls fell into the auto-generated weak `long sym(void)
          # {return 0;}` stubs and every guest stat/open/mmap/mprotect syscall
          # silently failed. ios_syscalls.o is NOT excluded from Pass-A: it
          # defines no libSystem-colliding interposers.
          echo "Compiling ios_syscalls.c (Darwin my_* syscall helpers)..."
          if $CC $CFLAGS -c "$IOSSC_SRC" -o "$OUTPUT_DIR/objects/ios_syscalls.o" 2>/tmp/box64_err_$$; then
              COMPILED=$((COMPILED + 1))
              echo "ios_syscalls.c: OK"
          else
              echo "ios_syscalls.c: FAILED"
              cat /tmp/box64_err_$$ 2>/dev/null | tail -5
          fi
          rm -f /tmp/box64_err_$$

          # Compile src/dynarec/dynarec.c (DynaRun/DynaCall/EmuRun dispatchers)
          # WITHOUT -DDYNAREC so it routes to the Box64 interpreter (Run() in
          # src/emu/x64run.c, already in SOURCES). This file used to be missing
          # from the build entirely, so DynaRun/DynaCall/EmuRun were auto-stubbed
          # to `long sym(void){return 0;}` and the main emulation never executed
          # a single guest instruction (post-DynaRun EAX=0, RIP/RSP unchanged).
          echo "Compiling dynarec.c (interpreter dispatcher)..."
          if $CC $CFLAGS -c "$BOX64_SRC/src/dynarec/dynarec.c" -o "$OUTPUT_DIR/objects/dynarec.o" 2>/tmp/box64_err_$$; then
              COMPILED=$((COMPILED + 1))
              echo "dynarec.c: OK"
          else
              echo "dynarec.c: FAILED"
              cat /tmp/box64_err_$$ 2>/dev/null | tail -8
          fi
          rm -f /tmp/box64_err_$$

          echo ""
          echo "Compiled: $COMPILED / $SRC_COUNT (Failed: $FAILED)"
          
          if [ $COMPILED -gt 0 ]; then
              # Create static library
              cd "$OUTPUT_DIR/objects"
              $AR rcs "$OUTPUT_DIR/libbox64.a" *.o
              echo "Created libbox64.a: $(ls -lh "$OUTPUT_DIR/libbox64.a")"
              
              # Auto-generate stubs for undefined symbols that libSystem genuinely lacks.
              echo "Generating stubs (dynamic_lookup link + tbd-filtered gap list)..."
              cd "$OUTPUT_DIR"

              # Pass A: link box64 WITHOUT stubs using -undefined dynamic_lookup.
              # The link SUCCEEDS, but nm -u then lists EVERY undefined symbol —
              # INCLUDING libc entry points (open/getpid/stat/__error) that libSystem
              # provides, because dynamic_lookup leaves them unbound (build-378 proved
              # v370's gap list still contained them, so the weak stubs shadowed
              # libSystem in the app link). The gap list is therefore derived by
              # SUBTRACTING what libSystem exports (parsed from the SDK .tbd stubs)
              # and what our own objects define.
              #
              # v371 tried a plain ld64 link instead (no dynamic_lookup) so the
              # "Undefined symbols" errors would BE the gap list — that FAILED:
              # box64's library.o references hundreds of wrapped*_init/_fini symbols
              # whose src/wrapped/ sources are excluded on iOS, so a plain link can
              # never succeed. The tbd-subtraction below handles BOTH the wrapped*
              # gaps and the libc symbols correctly.
              # Exclude ios_stubs.o + rawlibc.o from pass-A: they define strong
              # exit/_exit/abort interposers that would collide with libSystem's
              # strong copies (duplicate-symbol error). Their symbols are still
              # subtracted from the gap list via nm objects/*.o below.
              PASS_A_OBJS=""
              for o in objects/*.o; do
                  case "$o" in
                      *ios_stubs.o|*rawlibc.o) ;;
                      *) PASS_A_OBJS="$PASS_A_OBJS $o" ;;
                  esac
              done
              $CC -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" \
                  $PASS_A_OBJS -o box64 -lm -lSystem -Wl,-undefined,dynamic_lookup 2>/tmp/box64_link_passA.log || \
                  { echo "Pass-A link FAILED:"; tail -20 /tmp/box64_link_passA.log; exit 1; }

              nm -u box64 2>/dev/null | awk '{print $NF}' | sed 's/^_//' | sort -u > /tmp/all_undef.txt

              # Symbols provided by libSystem (SDK .tbd stubs) + defined by our objects.
              grep -hoE '_[A-Za-z0-9_]+' "$SDK"/usr/lib/*.tbd "$SDK"/usr/lib/system/*.tbd 2>/dev/null \
                  | sed 's/^_//' | sort -u > /tmp/libsystem_syms.txt
              nm objects/*.o 2>/dev/null | grep -v ' U ' | awk '{print $NF}' | sed 's/^_//' | sort -u >> /tmp/libsystem_syms.txt
              sort -u /tmp/libsystem_syms.txt -o /tmp/libsystem_syms.txt

              comm -23 /tmp/all_undef.txt /tmp/libsystem_syms.txt > /tmp/final_stubs.txt
              STUB_COUNT=$(wc -l < /tmp/final_stubs.txt)
              echo "Undefined total: $(wc -l < /tmp/all_undef.txt) | libSystem+own: $(wc -l < /tmp/libsystem_syms.txt) | genuine gaps: $STUB_COUNT"
              echo "--- gap list ---"
              cat /tmp/final_stubs.txt

              # Safety gate: real libc entry points must NEVER be stubbed. If any of
              # these appears in the gap list, the tbd filter failed — refuse to build
              # a corrupt app again.
              if grep -qxE 'open|openat|close|read|write|stat|fstat|lseek|mkdir|unlink|fopen|getpid|getuid|geteuid|getgid|getegid|getppid|syscall|__error|access|opendir|readdir|mmap|munmap|malloc|free|memcpy|strlen|printf|snprintf|dlopen|dlsym|dlclose|pthread_create|realpath|getcwd' /tmp/final_stubs.txt; then
                  echo "FATAL: gap list still contains real libc symbols — the tbd filter failed!"
                  grep -E 'open|getpid|stat|__error|syscall|write|close|read|mkdir' /tmp/final_stubs.txt
                  exit 1
              fi

              # Generate stubs C file — NO system headers at all to avoid macro conflicts
              {
                  echo '// Auto-generated stubs for symbols libSystem does NOT provide'
                  echo '// Gap list = dynamic_lookup nm -u minus SDK .tbd exports minus our own definitions'
                  echo ''
                  while IFS= read -r sym; do
                      [ -z "$sym" ] && continue
                      # v379: return 0/NULL instead of garbage. A `void sym(void){}`
                      # stub leaves x0 = first ARG on arm64, so pointer/boolean
                      # callers saw a non-NULL "value" for every gap symbol (GetEnv
                      # made BOX64_EXIT look set -> exit(0)). Returning 0 keeps the
                      # function address non-NULL (pointer checks still pass) but
                      # makes value-returning callers see NULL/0.
                      #
                      # v387: wrapped*_init MUST return -1 (error). These symbols
                      # back the wrappedlibs[] entries (src/wrapped/*.c are excluded
                      # from the iOS build, so box64's src/librarian/library.c calls
                      # a 0-returning stub for libc/libpthread/libdl init and treats
                      # 0 as success -> marks libc LIB_WRAPPED with NULL symbolmap/
                      # datamap khash tables -> kh_get(datamap, NULL, ...) -> SIGSEGV
                      # addr=0x0 in getSymbolInMaps during wine64 relocation. On error
                      # box64's NewLibrary falls back to initEmulatedLib, which loads
                      # the bundled real x86_64 glibc via BOX64_LD_LIBRARY_PATH.
                      case "$sym" in
                          wrapped*_init)
                              echo "__attribute__((weak)) long $sym(void) { return -1; }" ;;
                          *)
                              echo "__attribute__((weak)) long $sym(void) { return 0; }" ;;
                      esac
                  done < /tmp/final_stubs.txt
              } > auto_stubs.c

              STUB_LINES=$(wc -l < auto_stubs.c)
              echo "Generated $STUB_LINES lines of stubs"

              # Compile stubs — no warnings, no system headers needed
              $CC -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" \
                  -w -ffreestanding -nostdinc \
                  -c auto_stubs.c -o auto_stubs.o

              # Add stubs to the static library so the iOS app can link against them
              $AR rcs "$OUTPUT_DIR/libbox64.a" objects/*.o auto_stubs.o
              echo "Updated libbox64.a with stubs: $(ls -lh "$OUTPUT_DIR/libbox64.a")"

              # Pass B: relink box64 normally (stubs now satisfy only the genuine gaps)
              $CC -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" \
                  objects/*.o auto_stubs.o \
                  -o box64 -lm -lSystem
              chmod 755 box64
              echo "Created box64 executable: $(ls -la box64)"

              # Verify the diagnostic breadcrumbs are in the FINAL binary. A
              # stale object (v410) would silently omit them; refuse to package
              # so every device build is provably carrying the breadcrumbs.
              if ! strings box64 2>/dev/null | grep -q "\[MNEMU\] ParseElfHeader64 ENTER"; then
                  echo "ERROR: box64 binary missing ParseElfHeader64 breadcrumb (stale objects?); refusing to package"
                  exit 1
              fi
              if ! strings box64 2>/dev/null | grep -q "\[MNEMU\] LoadAndCheckElfHeader"; then
                  echo "ERROR: box64 binary missing LoadAndCheckElfHeader breadcrumb; refusing to package"
                  exit 1
              fi
              if ! strings box64 2>/dev/null | grep -q "\[iOS\] emulate: pre-DynaRun"; then
                  echo "ERROR: box64 binary missing quit-diag breadcrumb (stale objects?); refusing to package"
                  exit 1
              fi
              echo "box64 binary verified: contains all [MNEMU] breadcrumbs"
          else
              echo "ERROR: No Box64 files compiled"
              exit 1
          fi

      # ==========================================
      # Step 2: Download Wine, MoltenVK, DXVK
      # ==========================================
      - name: Download Wine (x86_64 Linux for Box64)
        run: |
          echo "=========================================="
          echo "  Downloading Wine for Box64"
          echo "=========================================="
          WINE_VERSION="9.21"
          WINE_URL="https://github.com/Kron4ek/Wine-Builds/releases/download/${WINE_VERSION}/wine-${WINE_VERSION}-amd64.tar.xz"
          echo "Downloading: $WINE_URL"
          curl -L "$WINE_URL" -o wine-amd64.tar.xz
          mkdir -p MNEmulator/Native/BundledBinaries/Wine
          tar xf wine-amd64.tar.xz -C MNEmulator/Native/BundledBinaries/Wine --strip-components=1
          rm -f wine-amd64.tar.xz
          echo "Wine contents:"
          ls -la MNEmulator/Native/BundledBinaries/Wine/
          ls -la MNEmulator/Native/BundledBinaries/Wine/bin/ 2>/dev/null || true

      - name: Download MoltenVK (iOS)
        run: |
          echo "=========================================="
          echo "  Downloading MoltenVK for iOS"
          echo "=========================================="
          MVK_URL="https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-ios.tar"
          echo "Downloading: $MVK_URL"
          curl -L "$MVK_URL" -o MoltenVK-ios.tar
          echo "=== MoltenVK tar structure ==="
          tar tf MoltenVK-ios.tar 2>/dev/null | head -30
          mkdir -p MNEmulator/Native/BundledBinaries/MoltenVK
          tar xf MoltenVK-ios.tar -C MNEmulator/Native/BundledBinaries/MoltenVK --strip-components=1 2>/dev/null || \
          tar xf MoltenVK-ios.tar -C MNEmulator/Native/BundledBinaries/MoltenVK --strip-components=0
          rm -f MoltenVK-ios.tar
          echo "=== Removing broken symlinks ==="
          find MNEmulator/Native/BundledBinaries/MoltenVK -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          echo "MoltenVK contents:"
          find MNEmulator/Native/BundledBinaries/MoltenVK -type f -o -type l | head -30

      - name: Download DXVK (Windows DLLs for Wine)
        run: |
          echo "=========================================="
          echo "  Downloading DXVK"
          echo "=========================================="
          DXVK_URL="https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz"
          echo "Downloading: $DXVK_URL"
          curl -L "$DXVK_URL" -o dxvk.tar.gz
          mkdir -p MNEmulator/Native/BundledBinaries/DXVK
          tar xf dxvk.tar.gz -C MNEmulator/Native/BundledBinaries/DXVK --strip-components=1
          rm -f dxvk.tar.gz
          echo "DXVK contents:"
          find MNEmulator/Native/BundledBinaries/DXVK -type f | head -20

      - name: Download glibc (x86_64) for Box64
        run: |
          echo "=========================================="
          echo "  Downloading x86_64 glibc for Box64"
          echo "=========================================="
          set -e
          GLIBC_DIR="MNEmulator/Native/BundledBinaries/glibc"
          rm -rf "$GLIBC_DIR"
          mkdir -p "$GLIBC_DIR"
          # Ubuntu 22.04 (jammy) amd64 libc6. Box64 emulates this real glibc for
          # the guest Wine: the iOS build excludes src/wrapped/*.c, so libc's
          # wrapped init now fails (stubs return -1) and NewLibrary loads these
          # ELFs instead via BOX64_LD_LIBRARY_PATH. Provides libc.so.6, libm.so.6,
          # ld-linux-x86-64.so.2, libpthread.so.0, libdl.so.2, librt.so.1,
          # libresolv.so.2, libutil.so.1, libanl.so.1 etc.
          curl -L -o "$GLIBC_DIR/libc6.deb" \
            "http://archive.ubuntu.com/ubuntu/pool/main/g/glibc/libc6_2.35-0ubuntu3_amd64.deb"
          cd "$GLIBC_DIR"
          ar x libc6.deb
          rm -f libc6.deb debian-binary
          rm -f control.tar.* control.tar.gz control.tar.xz control.tar.zst
          # data.tar.zst -> data.tar -> extract
          zstd -d -q data.tar.zst -o data.tar
          rm -f data.tar.zst
          tar -xf data.tar
          rm -f data.tar
          # Flatten lib/x86_64-linux-gnu/* into the glibc root. On glibc>=2.34
          # some names (libpthread/libdl/librt) are symlinks into libc; iOS
          # FileManager.copyItem resolves symlinks, so materialize any that
          # remain as real files with the exact needed soname.
          mv lib/x86_64-linux-gnu/* ./ 2>/dev/null || true
          # The deb ALSO ships lib64/ld-linux-x86-64.so.2 as an ABSOLUTE symlink
          # into the lib/ tree we just deleted. The real ld-linux-x86-64.so.2 is
          # already at the glibc root (from lib/), so drop the leftover lib64/
          # tree entirely — otherwise the dangling symlink breaks cp -R in the
          # inject/ipa steps ("No such file or directory").
          rm -rf lib lib64
          # Materialize any remaining symlinks as real files so nothing in the
          # bundle is a symlink (cp -R / FileManager.copyItem would dereference
          # or fail on them). Dangling ones are simply dropped.
          for l in $(find . -type l 2>/dev/null); do
            if [ -L "$l" ]; then
              if cp -L "$l" "$l.tmp" 2>/dev/null; then
                mv -f "$l.tmp" "$l"
              else
                rm -f "$l"
              fi
            fi
          done
          chmod 755 *.so* ld-linux-x86-64.so.2 2>/dev/null || true
          echo "glibc contents:"
          ls -lh
          file libc.so.6 libm.so.6 ld-linux-x86-64.so.2 libpthread.so.0 2>/dev/null || true

      - name: Bundle all binaries
        run: |
          echo "=========================================="
          echo "  Bundling all binaries into BundledBinaries"
          echo "=========================================="
          BIN_DIR="MNEmulator/Native/BundledBinaries"
          
          # Copy box64 executable into BundledBinaries (both root for direct access and Box64/ for organization)
          cp MNEmulator/Native/Box64Lib/box64 "$BIN_DIR/box64"
          chmod 755 "$BIN_DIR/box64"
          
          # Verify everything is in place
          echo "--- Box64 ---"
          ls -lh "$BIN_DIR/box64"
          echo "--- Wine ---"
          ls -lh "$BIN_DIR/Wine/bin/wine64" 2>/dev/null || echo "wine64: MISSING"
          echo "--- MoltenVK ---"
          find "$BIN_DIR/MoltenVK" -name "*.dylib" -o -name "libvulkan*" | head -5 || echo "MoltenVK: MISSING"
          echo "--- DXVK ---"
          find "$BIN_DIR/DXVK" -name "*.dll" | head -10 || echo "DXVK: MISSING"
          echo "--- Total size ---"
          du -sh "$BIN_DIR"

      # ==========================================
      # Step 3: Build iOS App with bundled binaries
      # ==========================================
      - name: Generate app icons
        run: |
          ICONSET="MNEmulator/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          python3 -c "
          import struct, zlib, os
          iconset = os.environ.get('ICONSET', '.')
          def make_png(w, h):
              raw = b''
              for y in range(h):
                  raw += b'\\x00'
                  for x in range(w):
                      t = y / max(h-1, 1)
                      r = int(25 + t*55)
                      g = int(8 + t*15)
                      b = int(160 - t*50)
                      raw += struct.pack('BBBB', r, g, b, 255)
              def chunk(ct, d):
                  c = ct + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              return b'\\x89PNG\\r\\n\\x1a\\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          sizes = {
              'icon-20.png': 20, 'icon-20@2x.png': 40, 'icon-20@3x.png': 60,
              'icon-29.png': 29, 'icon-29@2x.png': 58, 'icon-29@3x.png': 87,
              'icon-40.png': 40, 'icon-40@2x.png': 80, 'icon-40@3x.png': 120,
              'icon-60.png': 60, 'icon-60@2x.png': 120, 'icon-60@3x.png': 180,
              'icon-76.png': 76, 'icon-76@2x.png': 152,
              'icon-83.5@2x.png': 167, 'icon-1024.png': 1024,
          }
          for name, size in sizes.items():
              path = os.path.join(iconset, name)
              with open(path, 'wb') as f:
                  f.write(make_png(size, size))
              print(f'  {name}: {os.path.getsize(path)} bytes')
          print(f'Generated {len(sizes)} icons')
          "
          echo "=== Verify icons ==="
          ls -la "$ICONSET/icon-1024.png"
          file "$ICONSET/icon-1024.png"

      - name: Remove old xcodeproj
        run: |
          rm -rf MNEmulator.xcodeproj

      - name: Generate Xcode project
        run: |
          xcodegen generate 2>&1
          echo "Generated project:"
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj found"

      - name: Show targets
        run: |
          xcodebuild -project MNEmulator.xcodeproj -list

      - name: Build iOS App
        run: |
          set -o pipefail
          xcodebuild \
            -project MNEmulator.xcodeproj \
            -scheme MNEmulator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: Dump build log on failure
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -300 build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5

      - name: Upload compile errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-errors
          path: compile_errors.log
          retention-days: 5

      - name: Inject bundled binaries into .app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MNEmulator.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "MNEmulator.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: MNEmulator.app not found!"
            grep -i "error\|fatal\|cannot\|missing" build.log 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          BIN_SRC="MNEmulator/Native/BundledBinaries"
          BIN_DST="$APP_PATH/BundledBinaries"
          rm -rf "$BIN_DST"
          mkdir -p "$BIN_DST"
          
          echo "=== Copying box64 ==="
          cp "$BIN_SRC/box64" "$BIN_DST/box64"
          chmod 755 "$BIN_DST/box64"
          
          echo "=== Copying Wine ==="
          cp -R "$BIN_SRC/Wine" "$BIN_DST/"
          
          echo "=== Copying glibc (x86_64 guest libc for Box64) ==="
          cp -R "$BIN_SRC/glibc" "$BIN_DST/"
          # Safety net: the bundle must contain zero broken symlinks or the later
          # cp -r into build/Payload fails (macOS cp -R dereferences symlinks).
          find "$BIN_DST/glibc" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          echo "=== glibc symlinks after copy ==="
          find "$BIN_DST/glibc" -type l | wc -l
          
          echo "=== Copying MoltenVK ==="
          find "$BIN_SRC/MoltenVK" -type f | head -10
          cp -R "$BIN_SRC/MoltenVK" "$BIN_DST/"
          
          echo "=== Copying DXVK ==="
          find "$BIN_SRC/DXVK" -type f -name "*.dll" | head -5
          cp -R "$BIN_SRC/DXVK" "$BIN_DST/"
          
          echo "=== App size after injection ==="
          du -sh "$APP_PATH"
          echo "=== Bundled binaries in app ==="
          find "$BIN_DST" -name "box64" -o -name "wine64" -o -name "libc.so.6" -o -name "*.dylib" -o -name "*.dll" 2>/dev/null | head -20
          echo "=== glibc in app ==="
          ls -la "$BIN_DST/glibc/" 2>/dev/null | head -30
          echo "=== All files in BundledBinaries ==="
          find "$BIN_DST" -type f | wc -l

      - name: Create IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MNEmulator.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "MNEmulator.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Cannot create IPA - MNEmulator.app not found"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/MNEmulator.app
          cd build
          zip -r -y MNEmulator.ipa Payload/
          echo "=== IPA info ==="
          ls -lh MNEmulator.ipa
          echo "=== IPA size ==="
          du -sh MNEmulator.ipa

      - name: Upload IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MNEmulator-iOS
          path: build/MNEmulator.ipa
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        if: success()
        run: |
          TAG="build-${{ github.run_number }}"
          BODY="MN Emulator - PC Game Emulator for iPhone & iPad

          **Installation:**
          1. Download MNEmulator.ipa below
          2. Install via LiveContainer, SideStore, AltStore, or TrollStore
          3. For best performance: Use StikDebug to enable JIT

          **All-in-one IPA (no downloads needed):**
          - Box64 x86_64 to ARM64 translation (compiled from source)
          - Wine 9.21 (x86_64 Linux, runs via Box64)
          - MoltenVK 1.4.1 (Vulkan to Metal)
          - DXVK 2.6.1 (DirectX 11 to Vulkan)

          Supports iPhone & iPad (iOS 16+)

          Created by: @R_MOX"

          # Delete existing release/tag if present (from a retry)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          # Create fresh release
          gh release create "$TAG" build/MNEmulator.ipa \
            --title "MN Emulator Build #${{ github.run_number }}" \
            --notes "$BODY" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "========================================"
          if [ -f build/MNEmulator.ipa ]; then
            SIZE=$(ls -lh build/MNEmulator.ipa | awk '{print $5}')
            echo "  BUILD SUCCESS!"
            echo "  IPA size: $SIZE"
          else
            echo "  BUILD FAILED"
            tail -40 build.log || true
          fi
          echo "========================================"
